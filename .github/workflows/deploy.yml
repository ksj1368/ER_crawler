name: Deploy to EC2

on:
  push:
    branches:
      - main  # [변경] main 브랜치에 푸시될 때 배포 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. 현재 Runner의 공인 IP 가져오기
      - name: Get GitHub Actions Runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      # 2. AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. 보안 그룹에 현재 Runner IP 허용
      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # 4. 기존 배포 로직 (SSH 접속)
      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          script: |
            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/eternal_return_crawler"
            
            # 1. 디렉토리 확인 및 클론
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://${{ secrets.EC2_USER }}:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git $PROJECT_DIR
            fi
            
            cd $PROJECT_DIR
            
            # 2. 소스 코드 동기화
            git remote set-url origin https://${{ secrets.EC2_USER }}:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --all
            
            # [변경] main 브랜치로 전환 및 강제 동기화
            git checkout main
            git reset --hard origin/main
            git pull origin main

            # 3. 환경 변수 파일(.env) 생성 - Prod 모드 설정
            cat <<EOF > .env
            ENV=prod
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            API_KEY=${{ secrets.API_KEY }}
            EOF
            
            # 4. Docker Compose 실행
            docker compose down || true
            docker compose up -d --build
            
            # 5. 미사용 이미지 삭제
            docker image prune -f

      # 5. 보안 그룹에서 IP 삭제
      - name: Remove GitHub Actions IP from Security Group
        if: always() 
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32