name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get GitHub Actions Runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          script: |
            # 에러 발생 시 즉시 중단
            set -e

            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/eternal_return_crawler"
            
            # 1. 디렉토리 확인 및 클론 (토큰 인증 방식 적용)
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git $PROJECT_DIR
            fi
            
            cd $PROJECT_DIR
            

            # Docker가 만든 root 소유 파일을 현재 사용자로 변경
            echo "Fixing permissions for $PROJECT_DIR..."
            sudo chown -R $(whoami):$(whoami) .

            # 2. 소스 코드 동기화 (현재 배포하려는 브랜치 기준)
            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --all
            
            # 배포를 할 브랜치로 체크아웃
            TARGET_BRANCH="${{ github.ref_name }}"
            echo "Checking out branch: $TARGET_BRANCH"
            
            git checkout $TARGET_BRANCH
            git reset --hard origin/$TARGET_BRANCH
            git pull origin $TARGET_BRANCH

            # 3. 환경 변수 파일 생성
            cat <<EOF > .env
            ENV=prod

            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            API_KEY=${{ secrets.API_KEY }}
            
            AIRFLOW_UID=50000
            season_id = 35
            matching_mode = 3
            main_version = 2
            region_id = 10

            EOF
            
            # ----------------------------------------------------------------
            # 4. 분기 처리 로직 (Main vs Test)
            # ----------------------------------------------------------------
            
            # Docker 명령어 호환성 함수 정의
            function docker_compose_cmd() {
                if command -v docker-compose >/dev/null 2>&1; then
                    sudo docker-compose "$@"
                else
                    sudo docker compose "$@"
                fi
            }

            if [ "$TARGET_BRANCH" == "main" ]; then
                echo "[PRODUCTION] Main Branch Detected: Starting Crawler..."
                
                # 기존 컨테이너 종료 (에러 무시)
                docker_compose_cmd down || true
                
                # 실행 및 데이터 수집 시작 (Up)
                docker_compose_cmd up -d --build
                
            else
                echo "[TEST] Feature Branch Detected: Verifying Build Only..."
                echo "No data will be collected. Containers will NOT start."
                
                # 실행하지 않고 빌드만 수행 (Build Only)
                docker_compose_cmd build
            fi
            
            # 이미지 정리
            sudo docker image prune -f

      - name: Remove GitHub Actions IP from Security Group
        if: always() 
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32