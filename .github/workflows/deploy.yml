name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get GitHub Actions Runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          command_timeout: 30m
          script: |
            # 에러 발생 시 즉시 중단
            set -e

            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/eternal_return_crawler"
            
            # 1. 디렉토리 확인 및 클론 (토큰 인증 방식 적용)
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git $PROJECT_DIR
            fi
            
            cd $PROJECT_DIR
            
            # 권한 정리
            sudo chown -R $(whoami):$(whoami) .

            # 2. 소스 코드 동기화 (현재 배포하려는 브랜치 기준)
            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --all
            
            TARGET_BRANCH="${{ github.ref_name }}"
            git checkout $TARGET_BRANCH
            # 서버를 항상 GitHub 최신 상태와 동일하게 맞춤 (로컬 변경사항 삭제)
            git reset --hard origin/$TARGET_BRANCH
            git pull origin $TARGET_BRANCH

            # 3. 환경 변수 파일 생성
            cat <<EOF > .env
            ENV=prod
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            API_KEY=${{ secrets.API_KEY }}
            AIRFLOW_UID=50000
            season_id = 35
            matching_mode = 3
            main_version = 2
            region_id = 10

            EOF
            
            # ----------------------------------------------------------------
            # 4. 분기 처리 로직 (Main vs Test)
            # ----------------------------------------------------------------
            
            # Docker 명령어 호환성 함수 정의
            function docker_compose_cmd() {
                if command -v docker-compose >/dev/null 2>&1; then
                    sudo docker-compose "$@"
                else
                    sudo docker compose "$@"
                fi
            }

            # ----------------------------------------------------------------
            # 4. DB 상태 검증 및 마이그레이션 (Validation & Migration)
            # ----------------------------------------------------------------

            if [ "$TARGET_BRANCH" == "main" ]; then
                echo "[Check] Building migration tool..."
                docker_compose_cmd build db-migrator
                
                # (A) DB 상태 로그 출력 (디버깅용)
                # 현재 어떤 head 상태인지 로그에 남깁니다.
                echo "[Check] Current DB Heads:"
                docker_compose_cmd run --rm db-migrator alembic heads

                # (B) 마이그레이션 실행 (이것이 곧 검사입니다)
                # Alembic은 'multiple heads'가 존재하면 upgrade 명령 시 자동으로 에러를 내고 종료합니다.
                # 'set -e' 설정 때문에 여기서 에러가 나면 배포 스크립트 전체가 멈춥니다.
                echo "[Migration] Applying DB upgrades..."
                docker_compose_cmd run --rm --user root db-migrator alembic upgrade head
                
                # 위 단계가 성공해야만 아래 서비스 시작 로직이 실행됩니다.
                
                echo "[Deploy] Restarting services..."
                docker_compose_cmd down --timeout 15 --remove-orphans || true
                docker_compose_cmd up -d --build
            else
                echo "[TEST] Feature branch detected. Building only..."
                docker_compose_cmd build
            fi
            
            sudo docker image prune -f

      - name: Remove GitHub Actions IP from Security Group
        if: always() 
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32