name: CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Dummy .env for Test
        run: |
          cat <<EOF > .env
          ENV=test
          DB_HOST=erdb
          DB_PORT=3306
          DB_NAME=eternal_return_test
          DB_USER=root
          DB_PASSWORD=root
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_REGION=ap-northeast-2
          AWS_S3_BUCKET=test-bucket
          API_KEY=test
          AIRFLOW_UID=50000
          season_id=35
          matching_mode=3
          main_version=2
          region_id=10
          EOF

      - name: Build and Run Migration Test
        run: |
          # 1. DB 컨테이너 실행
          docker compose up -d erdb
          
          # 2. [핵심] MySQL이 접속 가능할 때까지 대기 (Healthcheck Loop)
          echo "Waiting for MySQL to be ready..."
          RETRIES=0
          until docker compose exec -T erdb mysql -u root -proot -e "SELECT 1;" > /dev/null 2>&1 || [ $RETRIES -eq 30 ]; do
            echo "Waiting for MySQL server... $((RETRIES++))s"
            sleep 1
          done
          
          if [ $RETRIES -eq 30 ]; then
            echo "Error: MySQL failed to start within 30 seconds."
            exit 1
          fi
          echo "MySQL is up and running!"

          # 3. 테스트용 DB 강제 생성 및 확인
          echo "Creating test database..."
          docker compose exec -T erdb mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS eternal_return_test;"
          
          echo "Current Databases:"
          docker compose exec -T erdb mysql -u root -proot -e "SHOW DATABASES;"

          # 4. 마이그레이션 도구 빌드
          docker compose build db-migrator
          
          # 5. 마이그레이션 실행 (이제 DB가 있으므로 성공해야 함)
          docker compose run --rm --entrypoint /bin/bash db-migrator -c "python -m alembic upgrade head"
          
      - name: Cleanup
        if: always()
        run: docker compose down -v

  deploy-to-ec2:
    needs: integration-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get GitHub Actions Runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e

            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/eternal_return_crawler"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git $PROJECT_DIR
            fi
            
            cd $PROJECT_DIR
            sudo chown -R $(whoami):$(whoami) .

            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --all
            
            # Dynamically switch to the branch that triggered this workflow
            TARGET_BRANCH="${{ github.ref_name }}"
            echo "Deploying branch: $TARGET_BRANCH"
            
            git checkout $TARGET_BRANCH
            git reset --hard origin/$TARGET_BRANCH
            git pull origin $TARGET_BRANCH

            cat <<EOF > .env
            ENV=prod
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            API_KEY=${{ secrets.API_KEY }}
            AIRFLOW_UID=50000
            season_id=35
            matching_mode=3
            main_version=2
            region_id=10
            EOF
            
            function docker_compose_cmd() {
                if command -v docker-compose >/dev/null 2>&1; then
                    sudo docker-compose "$@"
                else
                    sudo docker compose "$@"
                fi
            }

            echo "[Deploy] Starting production deployment..."
            
            docker_compose_cmd build db-migrator
            
            # 쉘(/bin/bash)을 이용하여 안전하게 실행
            docker_compose_cmd run --rm --entrypoint /bin/bash db-migrator -c "python -m alembic heads"
            docker_compose_cmd run --rm --user root --entrypoint /bin/bash db-migrator -c "python -m alembic upgrade head"
            
            docker_compose_cmd down --timeout 15 --remove-orphans || true
            docker_compose_cmd up -d --build
            
            sudo docker image prune -f

      - name: Remove GitHub Actions IP from Security Group
        if: always() 
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32