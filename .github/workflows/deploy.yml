name: Deploy to EC2

on:
  push:
    branches:
      - infra/cloud-deployment  # 이 브랜치에 푸시될 때만 실행 (main으로 변경 가능)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. 배포 대상 디렉토리 이동 및 소스 코드 유무 확인
            if [ ! -d "/home/${{ secrets.EC2_USER }}/eternal_return_crawler" ]; then
              git clone https://github.com/${{ github.repository }}.git /home/${{ secrets.EC2_USER }}/eternal_return_crawler
            fi
            
            cd /home/${{ secrets.EC2_USER }}/eternal_return_crawler
            
            # 2. 소스 코드 동기화
            # 배포 자동화 과정에서의 형상 관리 충돌 방지를 위해 로컬 변경사항 초기화 후 원격 코드 반영
            git fetch --all
            git reset --hard origin/infra/cloud-deployment
            git pull origin infra/cloud-deployment
            
            # 3. 실행 환경 설정 (.env)
            # 보안 관리를 위해 실제 운영 환경에서는 AWS SSM Parameter Store 등의 활용을 권고
            # 현재는 기존 배포 서버에 설정된 환경 변수 파일을 유지하여 배포를 진행함.
            
            # 4. 서비스 갱신 (컨테이너 재구동)
            # 애플리케이션 변경 사항을 이미지에 반영하기 위해 빌드 옵션 포함 실행
            docker-compose down
            docker-compose up -d --build
            
            # 5. 인프라 자원 최적화
            # 배포 과정에서 생성된 미사용 도커 이미지를 삭제하여 디스크 공간 확보
            docker image prune -f