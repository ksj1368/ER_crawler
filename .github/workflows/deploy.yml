name: Deploy to EC2

on:
  push:
    branches:
      - infra/cloud-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. 현재 Runner의 공인 IP 가져오기
      - name: Get GitHub Actions Runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      # 2. AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }} # 예: ap-northeast-2

      # 3. 보안 그룹에 현재 Runner IP 허용
      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # 4. 기존 배포 로직 (SSH 접속)
      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          script: |
            # 디렉토리 확인 및 클론
            if [ ! -d "/home/${{ secrets.EC2_USER }}/eternal_return_crawler" ]; then
              git clone https://github.com/${{ github.repository }}.git /home/${{ secrets.EC2_USER }}/eternal_return_crawler
            fi
            
            cd /home/${{ secrets.EC2_USER }}/eternal_return_crawler
            
            # 소스 코드 동기화
            git fetch --all
            git reset --hard origin/infra/cloud-deployment
            git pull origin infra/cloud-deployment
            
            # 컨테이너 재구동
            docker-compose down
            docker-compose up -d --build
            
            # 미사용 이미지 삭제
            docker image prune -f

      # 5. 보안 그룹에서 IP 삭제 (성공/실패 여부 상관없이 항상 실행)
      # 앞 단계가 실패해도 반드시 실행하여 보안 구멍 방지
      - name: Remove GitHub Actions IP from Security Group
        if: always() 
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32