name: CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # JOB 1: 통합 테스트 (모든 브랜치에서 실행)
  # 실제 배포 전에 GitHub 임시 서버에서 가짜 DB로 마이그레이션을 돌려봅니다.
  # ---------------------------------------------------------------------------
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Dummy .env for Test
        # 테스트용이므로 실제 비밀번호가 아니어도 되지만, docker-compose 실행을 위해 파일은 필요합니다.
        run: |
          cat <<EOF > .env
          ENV=test
          # 아래 DB 설정은 docker-compose.yml의 서비스명(erdb)과 일치해야 컨테이너끼리 통신합니다.
          DB_HOST=erdb
          DB_PORT=3306
          DB_NAME=eternal_return_test
          DB_USER=root
          DB_PASSWORD=root
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_REGION=ap-northeast-2
          AWS_S3_BUCKET=test-bucket
          API_KEY=test
          AIRFLOW_UID=50000
          season_id=35
          matching_mode=3
          main_version=2
          region_id=10
          EOF

      - name: Build and Run Migration Test
        run: |
          # 1. 테스트용 DB 컨테이너 실행
          docker compose up -d erdb
          
          # DB가 켜질 때까지 잠시 대기 (Healthcheck가 있다면 좋지만 간단히 sleep)
          sleep 10
          
          # 2. 마이그레이션 도구 빌드
          docker compose build db-migrator
          
          # 3. [핵심] 실제 마이그레이션 명령어 실행 테스트
          # 여기서 'Is a directory' 에러나 'Syntax Error'가 있다면 즉시 실패함
          # 가짜 DB이므로 충돌 걱정 없이 head까지 밀어봅니다.
          docker compose run --rm db-migrator python -m alembic upgrade head
          
      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # JOB 2: 실제 배포 (Main 브랜치이고 & 테스트가 통과했을 때만 실행)
  # ---------------------------------------------------------------------------
  deploy-to-ec2:
    needs: integration-test  # [중요] 테스트가 성공해야만 실행됨
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get GitHub Actions Runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e

            PROJECT_DIR="/home/${{ secrets.EC2_USER }}/eternal_return_crawler"
            
            # 1. 디렉토리 및 클론
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git $PROJECT_DIR
            fi
            
            cd $PROJECT_DIR
            sudo chown -R $(whoami):$(whoami) .

            # 2. 코드 동기화
            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --all
            
            git checkout main
            git reset --hard origin/main
            git pull origin main

            # 3. 환경 변수 생성 (실제 배포용)
            cat <<EOF > .env
            ENV=prod
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            API_KEY=${{ secrets.API_KEY }}
            AIRFLOW_UID=50000
            season_id=35
            matching_mode=3
            main_version=2
            region_id=10
            EOF
            
            # Docker 함수
            function docker_compose_cmd() {
                if command -v docker-compose >/dev/null 2>&1; then
                    sudo docker-compose "$@"
                else
                    sudo docker compose "$@"
                fi
            }

            # 4. 실제 배포 (테스트 Job 통과했으므로 안전하게 진행)
            echo "[Deploy] Starting production deployment..."
            
            # DB 상태 체크 (디버깅용)
            docker_compose_cmd build db-migrator
            docker_compose_cmd run --rm db-migrator python -m alembic heads

            # 마이그레이션 실행
            docker_compose_cmd run --rm --user root db-migrator python -m alembic upgrade head
            
            # 서비스 재시작
            docker_compose_cmd down --timeout 15 --remove-orphans || true
            docker_compose_cmd up -d --build
            
            sudo docker image prune -f

      - name: Remove GitHub Actions IP from Security Group
        if: always() 
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.REMOTE_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32