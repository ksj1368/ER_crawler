version: '3.8'

x-local-airflow-env: &local-airflow-env
  ENV: dev
  DB_HOST: er_mysql
  DB_PASSWORD: ${DB_PASSWORD:-password}

services:
  er_mysql:
    image: mysql:8.0
    container_name: er_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-erdb}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in your .env file}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  airflow-webserver:
    environment:
      <<: *local-airflow-env
      DB_USER: er_app_user
    depends_on:
      er_mysql:
        condition: service_healthy

  airflow-scheduler:
    environment:
      <<: *local-airflow-env
      DB_USER: root
    depends_on:
      er_mysql:
        condition: service_healthy

  airflow-init:
    environment:
      <<: *local-airflow-env
      DB_USER: root
    depends_on:
      er_mysql:
        condition: service_healthy

volumes:
  mysql_data:
